name: PrismML patched CUDA 13.3 validation
on:
  push:
    branches:
      - fix/prism-b10777-uaf
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prismml-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python security/verify_exact_fix.py

  parser-sanitizers:
    needs: verify-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential libssl-dev
      - name: Configure with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_SANITIZE_ADDRESS=ON -DGGML_SANITIZE_ADDRESS=ON \
            -DLLAMA_SANITIZE_UNDEFINED=ON -DGGML_SANITIZE_UNDEFINED=ON
      - name: Build parser tests
        run: cmake --build build --parallel 2 --target test-chat-peg-parser test-chat-auto-parser test-chat-template
      - name: Run parser tests
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -R '^test-chat-(peg-parser|auto-parser|template)$'

  windows-cuda13:
    needs: [verify-source, parser-sanitizers]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.3"
          cuda_arch: x64
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Configure and compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON -DLLAMA_BUILD_BORINGSSL=ON ^
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build build --config Release --parallel 3 --target llama-server test-chat-peg-parser test-chat-auto-parser test-chat-template test-arg-parser
          if errorlevel 1 exit /b 1
      - name: Windows parser and argument tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure -R '^test-(chat-peg-parser|chat-auto-parser|chat-template|arg-parser)$'
      - name: Package only after all tests pass
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item 'build\bin\Release\*' package\ -Recurse
          # CUDA runtime DLLs are already installed on the user's PC from the
          # separately verified official cudart archive; package the patched
          # PrismML binaries only, without guessing the runner's CUDA layout.
          if (-not (Test-Path 'package\llama-server.exe')) {
            throw 'Compiled llama-server.exe was not found'
          }
          Get-ChildItem package -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content package\SHA256SUMS.txt
          Compress-Archive package\* prismml-patched-cuda13.3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: prismml-patched-cuda13.3-${{ github.sha }}
          path: prismml-patched-cuda13.3.zip
          if-no-files-found: error
          retention-days: 14
